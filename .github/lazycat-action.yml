version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: sunshine
build:
  toolchains: []
  run_buildscript: false
images:
  - id: sunshine
    target: service
    service: sunshine
    source: docker.io/lizardbyte/sunshine
    channel: custom
    sort: semver
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+-ubuntu-26\.04$'
    version_regex: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-ubuntu-26\.04$'
    version_template: '{version}'
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Sunshine
    summary: 面向 Moonlight 的自托管游戏串流主机，支持硬件和软件编码，提供 Web 管理与客户端配对。
